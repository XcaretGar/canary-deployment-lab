
name: Canary lab CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-canary:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Unit tests
        run: node --test test/*.test.js

      - name: Start two releases and proxy
        run: docker compose up -d --build

      - name: Wait for HTTP readiness
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Validate canary routing
        run: |
          ./scripts/promote.sh canary10
          ./scripts/sample.sh 100 | tee /tmp/distribution.txt
          grep -q '"version":"v1"' /tmp/distribution.txt
          grep -q '"version":"v2"' /tmp/distribution.txt

      - name: Promote and rollback
        run: |
          ./scripts/promote.sh green

          for i in $(seq 1 10); do
            response=$(curl -fsS http://127.0.0.1:8080/api/info || true)
            echo "Intento $i Green: $response"

            if echo "$response" | grep -q '"version":"v2"'; then
              echo "Green funcionando correctamente"
              break
            fi

            if [ "$i" -eq 10 ]; then
              echo "Error: Green no respondió con v2"
              exit 1
            fi

            sleep 2
          done

          ./scripts/promote.sh blue

          for i in $(seq 1 10); do
            response=$(curl -fsS http://127.0.0.1:8080/api/info || true)
            echo "Intento $i Blue: $response"

            if echo "$response" | grep -q '"version":"v1"'; then
              echo "Rollback a Blue exitoso"
              break
            fi

            if [ "$i" -eq 10 ]; then
              echo "Error: Blue no respondió con v1"
              exit 1
            fi

            sleep 2
          done

      - name: Logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
